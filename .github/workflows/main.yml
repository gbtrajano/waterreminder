name: Lembrete de Água via Telegram

on:
  schedule:
    # Horários com minutos cravados (00 min): 09:00, 12:00, 17:00, 18:00 e 20:00 (Brasil)
    - cron: '0 12,15,20,21,23 * * *'
    
    # Horários de meia hora (30 min): 10:30, 14:30 e 15:30 (Brasil)
    - cron: '30 13,17,18 * * *'

  workflow_dispatch:

jobs:
  enviar-lembrete:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependências
        run: pip install requests

      - name: Executar bot
        run: python bot.py
